name: Supply Chain Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 1'  # weekly Monday midnight

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scanner
        run: |
          pip install requests
      - name: Download scanner
        run: |
          python -c "import urllib.request; urllib.request.urlretrieve('https://raw.githubusercontent.com/ZQM-Labs/snyk-replacement/main/snyk_replacement.py', 'snyk_replacement.py')"
      - name: Run scan
        run: |
          python snyk_replacement.py \
            --repo \${{ github.repository }} \
            --output both \
            --pr \${{ github.event.pull_request.number || 0 }}
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .zqm-security-reports/\${{ github.repository }}/$(date -u +%Y%m%dT%H%M%SZ)-results.sarif
        if: always()
      - name: Upload findings artifact
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-scan-\${{ github.run_id }}
          path: .zqm-security-reports/\${{ github.repository }}/
          retention-days: 30
        if: always()
